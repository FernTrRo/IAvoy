# Compila el APK de IAvoy en los servidores de GitHub (sin Android Studio).
# Se ejecuta en cada push a main, o a mano desde la pestaña Actions → "Compilar APK" → Run workflow.
# El APK queda para descargar en el resumen de la ejecución, en "Artifacts".
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La llave de Gemini NO está en el repositorio: se toma de los "secrets" de GitHub.
      - name: Compilar la app web
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: IAvoy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14